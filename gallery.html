<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>高曼荧 | 摄影展示</title>

<body>
  <header class="header">
    <div class="logo">高曼荧的摄影展</div>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="gallery.html" class="active">摄影展示</a>

      <figure class="photo">

      <figure class="photo">
        <img src="img/park.jpg" alt="park">

        <img src="img/station.jpg" alt="station">

      </figure>

      <figure class="photo">
        <img src="img/sunshine.jpg" alt="sunshine">
        <figcaption>黄昏静洒 · 2025 秋</figcaption>
      </figure>

    </section>
  </main>

  <footer class="footer">
    <p>© 2026 高曼荧 · 用镜头记录生活</p>
